<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNH.PROJECT — танец начинается с тишины внутри</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #eaeaea;
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        h2 { font-size: 2rem; color: #fff; margin-bottom: 32px; border-left: 5px solid #e63946; padding-left: 20px; }
        
        header {
            background: #0a0a0a;
            border-bottom: 2px solid #2a2a2a;
            padding: 18px 0;
            text-align: center;
        }
        .logo { font-size: 1.9rem; font-weight: 700; letter-spacing: 4px; color: #fff; }
        .logo span { color: #e63946; }
        
        .hero { padding: 70px 0; text-align: center; }
        .hero h1 { font-size: 3rem; color: #fff; }
        .hero p { color: #d4d4d4; font-size: 1.3rem; font-style: italic; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .gallery-item { border-radius: 16px; overflow: hidden; aspect-ratio: 1; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .admin-panel {
            background: #111;
            border: 2px solid #e63946;
            border-radius: 30px;
            padding: 30px;
            margin: 40px auto;
            max-width: 800px;
            display: none;
        }
        .admin-panel.active { display: block; }
        .admin-btn {
            background: #e63946;
            color: #fff;
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }
        .login-form { 
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 20px; 
            max-width: 400px; 
            margin: 30px auto; 
            text-align: center; 
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .hidden { display: none !important; }
        .admin-trigger { text-align: center; margin: 40px 0; }
        .admin-trigger a { color: #e63946; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div class="logo">TNH<span>.PROJECT</span></div>
</header>

<section class="hero">
    <h1>ТУТ НЕТ ЧЕЛОВЕКА</h1>
    <p>Иногда чувства проще выразить движением, чем словами.</p>
</section>

<section>
    <div class="container">
        <h2>Галерея</h2>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</section>

<div class="admin-trigger">
    <a onclick="showLogin()">🔒 Вход для администратора</a>
</div>

<div id="loginForm" class="login-form hidden">
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button class="admin-btn" onclick="checkLogin()">Войти</button>
</div>

<div id="adminPanel" class="admin-panel">
    <h2>Управление галереей</h2>
    <label style="color:#ccc;">GitHub токен (нужен один раз)</label>
    <input type="password" id="githubToken" placeholder="ghp_...">
    <label style="color:#ccc;">Загрузить фото</label>
    <input type="file" id="fileInput" accept="image/*" multiple style="color:#fff;">
    <button class="admin-btn" onclick="uploadToGitHub()">📤 Загрузить на GitHub</button>
    <div id="status" style="color:#e63946; margin-top:10px;"></div>
</div>

<script>
    // === НАСТРОЙКИ GITHUB ===
    const GITHUB_USERNAME = "ВАШ_ЛОГИН";    // ← замените
    const GITHUB_REPO = "tnh-project";       // ← замените
    const BRANCH = "main";                    // или master
    const IMAGES_FOLDER = "images/";          // папка для фото

    // Список фото (будет загружаться с GitHub)
    let galleryImages = [];

    // Загрузка списка фото с GitHub API
    async function loadGallery() {
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${IMAGES_FOLDER}`);
            if (response.ok) {
                const files = await response.json();
                galleryImages = files
                    .filter(file => file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i))
                    .map(file => file.download_url);
                renderGallery();
            } else {
                // Если папки нет, показываем пусто
                document.getElementById('galleryGrid').innerHTML = '<p style="color:#888;">Фото скоро появятся</p>';
            }
        } catch (e) {
            document.getElementById('galleryGrid').innerHTML = '<p style="color:#888;">Галерея загружается...</p>';
        }
    }

    function renderGallery() {
        const grid = document.getElementById('galleryGrid');
        if (galleryImages.length === 0) {
            grid.innerHTML = '<p style="color:#888;">Фото скоро появятся</p>';
        } else {
            grid.innerHTML = galleryImages.map(img => 
                `<div class="gallery-item"><img src="${img}" alt="Dance"></div>`
            ).join('');
        }
    }

    function showLogin() {
        document.getElementById('loginForm').classList.remove('hidden');
    }

    function checkLogin() {
        const password = document.getElementById('passwordInput').value;
        if (password === '1234') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('active');
        } else {
            alert('Неверный пароль');
        }
    }

    async function uploadToGitHub() {
        const token = document.getElementById('githubToken').value.trim();
        const files = document.getElementById('fileInput').files;
        const status = document.getElementById('status');
        
        if (!token) {
            status.textContent = '❌ Введите GitHub токен';
            return;
        }
        
        if (files.length === 0) {
            status.textContent = '❌ Выберите фото для загрузки';
            return;
        }

        status.textContent = '⏳ Загружаем...';

        for (let file of files) {
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1];
                const filename = Date.now() + '-' + file.name.replace(/\s+/g, '-');
                
                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${IMAGES_FOLDER}${filename}`,
                        {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                message: `Add photo ${filename}`,
                                content: base64,
                                branch: BRANCH
                            })
                        }
                    );
                    
                    if (response.ok) {
                        status.textContent = `✅ ${file.name} загружен!`;
                        loadGallery();
                    } else {
                        const error = await response.json();
                        status.textContent = `❌ Ошибка: ${error.message}`;
                    }
                } catch (err) {
                    status.textContent = '❌ Ошибка сети';
                }
            };
            
            reader.readAsDataURL(file);
        }
    }

    // Загружаем галерею при старте
    loadGallery();
</script>
</body>
</html>
